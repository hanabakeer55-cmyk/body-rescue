<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تحدي إنقاذ جسم الإنسان</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--o:#ff7a1a;--ok:#12b76a;--no:#f04438;--p:#6c3df5;--p2:#00b8a9;--card:#fff;--tx:#1d2340;--mu:#5b6385;--ln:#dfe3f5;--h:#6c3df5;--b1:#7c4dff;--b2:#00c9b7;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--card:#1f2245;--tx:#f2f4ff;--mu:#b3b9e0;--ln:#34386a;--h:#c3b3ff;--b1:#2d1b79;--b2:#06635d}}
:root[data-theme="dark"]{--card:#1f2245;--tx:#f2f4ff;--mu:#b3b9e0;--ln:#34386a;--h:#c3b3ff;--b1:#2d1b79;--b2:#06635d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:inherit}
body{margin:0;min-height:100vh;font-family:'Tajawal','Segoe UI',Tahoma,system-ui,sans-serif;color:var(--tx);background:linear-gradient(135deg,var(--b1),var(--b2)) fixed;background-color:var(--b1);font-size:clamp(17px,2.1vw,24px);line-height:1.7}
.wrap{max-width:900px;margin:auto;padding:12px}
.card{background:var(--card);border-radius:24px;padding:22px;box-shadow:0 10px 30px #0003;margin:12px 0}
.tc{text-align:center}.big{font-size:3.4rem;line-height:1.3}
h1{margin:.2em 0;font-size:clamp(28px,5vw,46px);color:var(--h)}
h2{font-size:1.25em;margin:.4em 0}h3{margin:.2em 0}
p{margin:.4em 0}.mu{color:var(--mu)}
.btn{border:0;border-radius:16px;padding:12px 30px;font:inherit;font-weight:800;color:#fff;background:linear-gradient(135deg,var(--o),#ff3d71);cursor:pointer;box-shadow:0 5px 0 #0002;margin:10px 4px 0}
.btn:active{transform:translateY(3px)}.btn.g2{background:linear-gradient(135deg,var(--p),#3d8bff)}
label{display:block;text-align:right;font-weight:700}
input{width:100%;padding:10px 14px;border-radius:12px;border:2px solid var(--ln);font:inherit;background:var(--card);color:var(--tx);margin:4px 0 10px}
.rules{text-align:right;list-style:none;padding:0;margin:12px 0 0;font-size:.85em;color:var(--mu)}
.hud{display:flex;justify-content:space-between;gap:8px;color:#fff;font-weight:800;padding:4px 8px;flex-wrap:wrap}
.trk{display:flex;justify-content:center;gap:10px;margin:6px 0}
.trk i{font-style:normal;width:2.2em;height:2.2em;display:grid;place-items:center;border-radius:50%;background:#ffffff40;opacity:.7}
.trk .cur{background:#fff;opacity:1;transform:scale(1.18)}.trk .dn{background:var(--ok);opacity:1}
.bal{height:14px;border-radius:9px;background:#ffffff40;overflow:hidden}
.bal span{display:block;height:100%;background:linear-gradient(90deg,#ffd93d,#12b76a);transition:width .6s}
.balt{color:#fff;font-size:.75em;font-weight:700;text-align:center}
.tag{display:inline-block;background:var(--p);color:#fff;border-radius:20px;padding:0 14px;font-size:.8em;font-weight:700}
.tbar{height:12px;border-radius:8px;background:var(--ln);overflow:hidden;margin-top:10px}
.tbar span{display:block;height:100%;background:var(--p2);transition:width 1s linear}
.tbar.warn span{background:var(--no)}
.opt{display:block;width:100%;text-align:right;margin:10px 0;padding:14px 18px;border-radius:16px;border:3px solid var(--ln);background:var(--card);color:var(--tx);font:inherit;font-weight:700;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--p)}
.opt.ok,.opt.dn2{background:var(--ok);border-color:var(--ok);color:#fff}.opt.no{background:var(--no);border-color:var(--no);color:#fff}
.opt.sel{border-color:var(--o);background:#ff7a1a33}.opt.dn2{pointer-events:none}
.it{display:inline-block;width:auto;margin:6px}
.chain{min-height:3em;border:3px dashed var(--ln);border-radius:16px;padding:8px;margin-bottom:10px}
.chain b{display:inline-block;background:var(--ok);color:#fff;border-radius:12px;padding:2px 12px;margin:3px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fb{margin-top:14px;padding:14px;border-radius:16px;border-right:8px solid}
.fb.g{background:#12b76a26;border-color:var(--ok)}.fb.b{background:#f0443826;border-color:var(--no)}
.sh{animation:sh .35s}@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.stars{font-size:2.2rem;letter-spacing:4px}
canvas#cf{position:fixed;inset:0;pointer-events:none;display:none;z-index:9}
table{width:100%;border-collapse:collapse;font-size:.8em}th,td{padding:8px;border-bottom:2px solid var(--ln);text-align:right}th{color:var(--h)}
@media print{body{background:#fff}.np,.hud,.trk,.bal,.balt{display:none!important}}
</style>
</head>
<body>
<canvas id="cf"></canvas>
<main class="wrap" id="app"></main>
<script>
const S=[
{n:'المغذيات',i:'🥗',s:'نفد مخزون الطاقة في خلايا الجسم! لا بدّ من فهم المغذيات للكشف عنها وتعويضها.',q:[
{t:'m',q:'ما المغذي الذي يُعدّ المصدر الأساسي للطاقة اللازمة للخلايا؟',o:['الكربوهيدرات','الفيتامينات','الأملاح المعدنية','الألياف الغذائية'],a:0,e:'الكربوهيدرات تمدّ الخلايا بمصدر سريع للطاقة، ويُمتصّ السكر الأحادي بسرعة.'},
{t:'m',q:'🧩 لغز: نحن وحدات بنائية عددنا نحو 20 نوعاً، وإذا اتحدت عدّة منّا كوّنّا ببتيداً ثم بروتيناً. من نحن؟',o:['الحموض الأمينية','الحموض الدهنية','السكريات الأحادية','الأملاح المعدنية'],a:0,e:'تتكوّن البروتينات من وحدات بنائية تُسمّى الحموض الأمينية.'},
{t:'x',q:'🔬 مهمة المختبر: صِلن كل كاشف بالمغذي الذي يكشف عنه.',p:[['محلول لوغول (اليود)','النشا'],['كبريتات النحاس + هيدروكسيد الصوديوم','البروتينات'],['الإيثانول','الزيوت والدهون'],['الإندوفينول','فيتامين C']],e:'لوغول يكشف النشا، والكاشف البنفسجي يكشف البروتين، والإيثانول يكشف الزيوت والدهون، ويزول لون الإندوفينول بوجود فيتامين C.'}]},
{n:'الجهاز الهضمي',i:'🍽️',s:'توقفت لقمة الطعام في منتصف الطريق! ساعدنها على إكمال رحلتها داخل القناة الهضمية.',q:[
{t:'m',q:'أيّ إنزيم في اللعاب يبدأ بتحطيم النشا في الفم؟',o:['الأميليز','الببسين','التربسين','الليبيز'],a:0,e:'إنزيم الأميليز في اللعاب يبدأ هضم النشا كيميائياً منذ الفم.'},
{t:'m',q:'🧩 لغز: أفرزتني المعدة، أقتل معظم الجراثيم في الطعام، ولا يعمل الببسين من دوني. من أنا؟',o:['حمض الهيدروكلوريك','العصارة الصفراء','بيكربونات الصوديوم','اللعاب'],a:0,e:'تفرز المعدة حمض الهيدروكلوريك الذي يقتل معظم الجراثيم ويهيّئ الوسط لعمل إنزيم الببسين.'},
{t:'o',q:'🧭 رتّبن رحلة لقمة الطعام من البداية إلى النهاية (اضغطن بالترتيب).',o:['الفم','البلعوم','المريء','المعدة','الأمعاء الدقيقة','الأمعاء الغليظة','الشرج'],e:'الفم ← البلعوم ← المريء ← المعدة ← الأمعاء الدقيقة (معظم الهضم والامتصاص) ← الأمعاء الغليظة (امتصاص الماء) ← الشرج.'}]},
{n:'الجهاز التنفسي',i:'🫁',s:'الأكسجين لا يصل إلى الخلايا! أعدن فتح الممرات الهوائية.',q:[
{t:'o',q:'🧭 رتّبن مسار الهواء من دخوله إلى وصوله لمكان تبادل الغازات.',o:['الأنف','البلعوم','الحنجرة','القصبة الهوائية','الشعب الهوائية','القصيبات','الحويصلات الهوائية'],e:'ينتهي مسار الهواء في الحويصلات الهوائية، حيث يتم تبادل الغازات مع الشعيرات الدموية.'},
{t:'m',q:'ما الذي يُبقي القصبة الهوائية مفتوحة على الدوام؟',o:['حلقات غضروفية على شكل C','عضلات قوية مخططة','عظام صغيرة متصلة','طبقة المخاط فقط'],a:0,e:'تدعمها نحو 16–20 حلقة غضروفية غير مكتملة الاستدارة، فتبقى مفتوحة.'},
{t:'m',q:'ما العامل الذي يستثير مركز التنفس في الدماغ فيحدث الشهيق؟',o:['ارتفاع تركيز CO₂ في الدم','انخفاض درجة حرارة الجسم','ارتفاع تركيز الأكسجين في الدم','امتلاء المعدة بالطعام'],a:0,e:'ارتفاع CO₂ في الدم يستثير مركز التنفس، فيرسل سيالات عصبية إلى الحجاب الحاجز وعضلات الضلوع فيحدث الشهيق.'}]},
{n:'الجهاز الدوراني',i:'❤️',s:'القلب يضخّ ببطء والدم تاه عن مساره! أعدن تنظيم النقل داخل الجسم.',q:[
{t:'m',q:'أيّ الشرايين الآتية ينقل دماً غير مؤكسج؟',o:['الشريان الرئوي','الشريان الأبهر','الشريان التاجي','جميع الشرايين'],a:0,e:'جميع الشرايين تنقل دماً مؤكسجاً ما عدا الشريان الرئوي الذي ينقل دماً غير مؤكسج إلى الرئتين.'},
{t:'m',q:'🧩 لغز: أنا بروتين في خلايا الدم الحمراء، في تركيبي عنصر الحديد، وأحمل الأكسجين. من أنا؟',o:['الهيموغلوبين','الأميليز','الإنسولين','الببسين'],a:0,e:'الهيموغلوبين يرتبط بالأكسجين، ونقص الحديد أو الهيموغلوبين يسبب فقر الدم.'},
{t:'x',q:'🩸 مهمة المختبر: صِلن كل مكوّن من الدم بوظيفته.',p:[['خلايا الدم الحمراء','نقل الأكسجين'],['خلايا الدم البيضاء','الدفاع عن الجسم'],['الصفائح الدموية','تخثّر الدم'],['البلازما','سائل أصفر معظمه ماء']],e:'الحمراء تنقل الأكسجين، والبيضاء تدافع عن الجسم، والصفائح تساعد على التخثر، والبلازما سائل يشكل الماء نحو 92% منه.'}]},
{n:'الجهاز الليمفي',i:'🛡️',s:'خط الدفاع الأخير يتراجع! أعدن السائل الليمفي إلى الدورة الدموية.',q:[
{t:'m',q:'ماذا يُسمّى السائل الباقي بين الخلايا الذي يعود عبر الشعيرات الليمفية؟',o:['الليمف','البلازما','العصارة الصفراء','اللعاب'],a:0,e:'يرشح السائل بين الخلوي من الشعيرات الدموية، والجزء المتبقي منه بين الخلايا يُسمّى الليمف.'},
{t:'m',q:'صواب أم خطأ؟ تحمل الأوعية الليمفية في خملات الأمعاء معظم الحموض الدهنية والغليسرول الممتصة.',o:['صواب ✅','خطأ ❌'],a:0,e:'صحيح، فمعظم الحموض الدهنية والغليسرول يُمتص عبر الشعيرات الليمفية ثم يصل إلى تيار الدم.'},
{t:'o',q:'🧭 رتّبن رحلة الليمف حتى يعود إلى الدم.',o:['السائل بين الخلوي','الشعيرات الليمفية','الأوعية الليمفية','الوريد الأجوف العلوي'],e:'يعود الليمف عبر الشعيرات الليمفية فالأوعية الليمفية، ثم يصبّ في الوريد الأجوف العلوي.'}]}
];
const $=s=>document.querySelector(s),A=$('#app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sh=a=>{let b;do{b=a.slice();for(let i=b.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[b[i],b[j]]=[b[j],b[i]]}}while(a.length>1&&b.every((x,i)=>x===a[i]));return b};
let ac;const beep=(f,d=.15)=>{try{ac=ac||new AudioContext();const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;g.gain.value=.07;o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}};
let G={team:'',mem:[],si:0,st:[],score:0};
const Q=()=>S[G.si].q[G.qi],tot=()=>G.st.reduce((a,b)=>a+b,0);
const hud=()=>`<div class="hud"><span>👥 ${esc(G.team)}</span><span>⭐ ${tot()}</span><span id="sc">🏅 ${G.score}</span></div><div class="trk">${S.map((s,i)=>`<i class="${G.st.length>i?'dn':i==G.si?'cur':''}">${s.i}</i>`).join('')}</div><div class="bal"><span style="width:${Math.round(tot()/15*100)}%"></span></div><div class="balt">⚖️ توازن الجسم ${Math.round(tot()/15*100)}%</div>`;
function home(){chk();const sv=load();if(sv){G={team:sv.team,mem:sv.mem,si:5,qi:0,st:sv.st,score:sv.score,el:sv.el};final(true);return}A.innerHTML=`<section class="card tc"><div class="big">🫀🫁🍽️🛡️</div><h1>تحدي إنقاذ جسم الإنسان</h1><p>حدث خلل في أجهزة الجسم! أنجزن 5 تحديات علمية لإعادة التوازن إلى الجسم 🚨</p><label>اسم المجموعة<input id="tn" maxlength="24" placeholder="مثال: فريق الأطباء الصغار"></label><label>أسماء أفراد المجموعة (افصلن بينها بفاصلة)<input id="mm" placeholder="مثال: سارة، لينا، ريم"></label><button class="btn" onclick="begin()">ابدأن المهمة 🚀</button><ul class="rules"><li>🏠 تُنجَز في البيت: تجتمع المجموعة حول جهاز واحد.</li><li>👑 لكل مرحلة قائدة بالتناوب تقرأ السؤال، وتجيب المجموعة بعد تشاور.</li><li>⏱️ لكل سؤال وقت محدد، والسرعة تمنح نقاطاً إضافية.</li><li>⭐ تحصل المجموعة على نجمة لكل إجابة صحيحة (3 نجوم في كل مرحلة).</li></ul><div id="tz"></div></section>`}
function begin(){G={team:$('#tn').value.trim()||'فريق الأبطال',mem:$('#mm').value.split(/[،,]/).map(x=>x.trim()).filter(Boolean),si:0,st:[],score:0,t0:Date.now()};beep(520);intro()}
function intro(){const s=S[G.si];G.qi=0;G.sOk=0;const l=G.mem.length?`<p>👑 قائدة المرحلة: <b>${esc(G.mem[G.si%G.mem.length])}</b><br><span class="mu">تقرأ السؤال بصوت مسموع، وتجيب المجموعة بعد تشاور قصير.</span></p>`:'';
A.innerHTML=hud()+`<section class="card tc"><div class="big">${s.i}</div><span class="tag">المرحلة ${G.si+1} من 5</span><h1>${s.n}</h1><p>🚨 ${s.s}</p>${l}<button class="btn" onclick="ask()">هيا نبدأ ▶</button></section>`}
function ask(){const s=S[G.si],q=Q();G.mis=0;G.done=false;G.pos=0;G.mt=0;G.sel=null;G.left=G.max=q.t=='m'?30:60;let b='';
if(q.t=='m')b=sh(q.o.map((o,i)=>i)).map(i=>`<button class="opt" data-i="${i}" onclick="pick(${i})">${esc(q.o[i])}</button>`).join('');
else if(q.t=='o'){G.it=sh(q.o);b=`<div class="chain" id="ch"></div>`+G.it.map((v,i)=>`<button class="opt it" id="i${i}" onclick="tap(${i})">${esc(v)}</button>`).join('')}
else{const r=sh(q.p.map((p,i)=>i));b=`<div class="cols"><div>${q.p.map((p,i)=>`<button class="opt" id="L${i}" onclick="tl(${i})">${esc(p[0])}</button>`).join('')}</div><div>${r.map(j=>`<button class="opt" id="R${j}" onclick="tr(${j})">${esc(q.p[j][1])}</button>`).join('')}</div></div>`}
A.innerHTML=hud()+`<section class="card"><span class="tag">${s.i} ${s.n} · سؤال ${G.qi+1} من 3</span><div class="tbar" id="tb"><span style="width:100%"></span></div><p class="mu">⏱️ <b id="tt">${G.left}</b> ثانية</p><h2>${q.q}</h2>${b}<div id="fb"></div></section>`;
clearInterval(G.T);G.T=setInterval(()=>{G.left--;tm();if(G.left<=0)timeout()},1000)}
function tm(){const t=$('#tt');if(!t)return;t.textContent=Math.max(G.left,0);const b=$('#tb');b.querySelector('span').style.width=Math.max(G.left,0)/G.max*100+'%';b.classList.toggle('warn',G.left<=8)}
function pick(i){if(G.done)return;const q=Q();document.querySelectorAll('.opt').forEach(b=>{b.disabled=true;const k=+b.dataset.i;if(k==q.a)b.classList.add('ok');else if(k==i)b.classList.add('no')});fin(i==q.a)}
const bad=e=>{G.mis++;e.classList.add('sh');setTimeout(()=>e.classList.remove('sh'),400);beep(180)};
function tap(i){if(G.done)return;const q=Q(),v=G.it[i];if(v==q.o[G.pos]){$('#ch').innerHTML+=`<b>${G.pos+1}. ${esc(v)}</b>`;$('#i'+i).remove();G.pos++;beep(660,.08);if(G.pos==q.o.length)fin(G.mis<=1)}else bad($('#i'+i))}
function tl(i){if(G.done)return;document.querySelectorAll('[id^=L]').forEach(b=>b.classList.remove('sel'));G.sel=i;$('#L'+i).classList.add('sel')}
function tr(j){if(G.done||G.sel==null)return;if(j==G.sel){['L','R'].forEach(p=>{const e=$('#'+p+j);e.classList.remove('sel');e.classList.add('dn2')});G.sel=null;G.mt++;beep(660,.08);if(G.mt==Q().p.length)fin(G.mis<=1)}else bad($('#R'+j))}
function timeout(){if(G.done)return;const q=Q();if(q.t=='m')document.querySelectorAll('.opt').forEach(b=>{b.disabled=true;if(+b.dataset.i==q.a)b.classList.add('ok')});fin(false)}
function fin(ok){if(G.done)return;G.done=true;clearInterval(G.T);const q=Q(),m=q.t=='m',l=G.left;let p=0,h;
if(ok){p=m?10+Math.ceil(l/5):15+Math.floor(l/10);h='🎉 أحسنتنّ! إجابة صحيحة'}
else if(l<=0)h='⏰ انتهى الوقت';
else if(m)h='💡 ليست الإجابة الصحيحة';
else{p=5;h='👍 أنجزتنّ المهمة لكن بأخطاء كثيرة'}
G.score+=p;if(ok)G.sOk++;beep(ok?880:220,.3);$('#sc').textContent='🏅 '+G.score;
$('#fb').innerHTML=`<div class="fb ${ok?'g':'b'}"><h3>${h}${p?' · +'+p+' نقطة':''}</h3><p>${q.e}</p><button class="btn" onclick="nxt()">${G.qi==2?'نتيجة المرحلة ⭐':'السؤال التالي ◀'}</button></div>`;
$('#fb').scrollIntoView({behavior:'smooth',block:'nearest'})}
function nxt(){G.qi++;G.qi<3?ask():stageEnd()}
function stageEnd(){const s=S[G.si],n=G.sOk;G.st.push(n);const m=n==3?'مذهل! الجهاز يعمل بكفاءة كاملة 💪':n>0?'الجهاز يعمل، لكنه يحتاج مزيداً من الدعم 🔧':'ما زال الجهاز مضطرباً، راجعن الدرس في الكتاب 📖';
A.innerHTML=hud()+`<section class="card tc"><div class="big">${n?'✅':'🛠️'}</div><h1>${s.i} ${s.n}</h1><div class="stars">${'⭐'.repeat(n)}${'☆'.repeat(3-n)}</div><p>${m}</p><p>🏅 مجموع النقاط: <b>${G.score}</b></p><button class="btn" onclick="adv()">${G.si==4?'اعرضن النتيجة النهائية 🏆':'المرحلة التالية ▶'}</button></section>`}
function adv(){G.si++;G.si<5?intro():final()}
function fmt(s){const m=Math.floor(s/60),r=s%60;return m?`${m} دقيقة و${r} ثانية`:`${r} ثانية`}
function final(rep){if(!rep&&G.el==null&&G.t0)G.el=Math.round((Date.now()-G.t0)/1000);const t=tot(),r=t>=13?['🏆','بطلة إنقاذ الجسم']:t>=9?['🥇','طبيبة ماهرة']:t>=5?['🥈','مسعفة مجتهدة']:['🥉','متدربة واعدة'];
A.innerHTML=hud()+`<section class="card tc">${rep?'<p style="background:#fff3cd;border-radius:12px;padding:10px">🔒 لقد أنجزتنّ اللعبة من قبل، ولا يمكن إعادتها. هذه نتيجتكنّ المسجّلة.</p>':''}<div class="big">${r[0]}</div><h1>مبروك! عاد التوازن إلى الجسم 🎉</h1><p>المجموعة <b>${esc(G.team)}</b> حصلت على لقب</p><h2 style="color:var(--h);font-size:1.8em">${r[1]}</h2>${G.mem.length?`<p class="mu">👥 ${G.mem.map(esc).join(' • ')}</p>`:''}<p>🏅 <b>${G.score}</b> نقطة &nbsp; ⭐ <b>${t}</b> من 15 نجمة</p>${G.el!=null?`<p>⏱️ الوقت الكلي: <b>${fmt(G.el)}</b></p>`:''}${S.map((s,i)=>`<div>${s.i} ${s.n}: ${'⭐'.repeat(G.st[i])}${'☆'.repeat(3-G.st[i])}</div>`).join('')}<p class="mu">${t==15?'علامة كاملة! أنتنّ نجمات العلوم 🌟':'أحسنتنّ على المحاولة 👏'}</p><div class="np"><a class="btn" style="display:inline-block;text-decoration:none;background:linear-gradient(135deg,#25d366,#128c7e)" href="${waLink()}" target="_blank" rel="noopener">📲 أرسلن النتيجة للمعلمة عبر واتساب</a><br><button class="btn" onclick="cp()" id="cpb">📋 نسخ النتيجة</button><button class="btn g2" onclick="print()">🖨️ طباعة الشهادة</button></div><p id="sv" class="mu">📲 اضغطن زر واتساب ثم «إرسال» لتصل النتيجة إلى المعلمة.</p><p id="cpt" class="mu"></p></section>`;if(!rep){save();conf();beep(660,.2);setTimeout(()=>beep(880,.3),220)}}
function waLink(){const m=`نتيجة لعبة تحدي إنقاذ جسم الإنسان 🏆\nالمجموعة: ${G.team}\nالأعضاء: ${G.mem.join('، ')||'-'}\nالنقاط: ${G.score}\nالنجوم: ${tot()} من 15\n${G.el!=null?'الوقت: '+fmt(G.el)+'\n':''}`+S.map((s,i)=>`${s.i} ${s.n}: ${G.st[i]}/3`).join('\n');return 'https://wa.me/972599035621?text='+encodeURIComponent(m)}
function cp(){const x=`المجموعة ${G.team}: ${G.score} نقطة و${tot()} نجمة من 15${G.el!=null?' في '+fmt(G.el):''} في لعبة تحدي إنقاذ جسم الإنسان 🏆`;$('#cpt').textContent=x;try{navigator.clipboard.writeText(x).then(()=>{$('#cpb').textContent='تم النسخ ✅'},()=>{})}catch(e){}}
function conf(){const c=$('#cf'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;c.style.display='block';const P=Array.from({length:130},()=>({x:Math.random()*c.width,y:-Math.random()*c.height,r:5+Math.random()*7,v:2+Math.random()*4,h:Math.random()*360,s:Math.random()*2-1}));let n=0;(function f(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.y+=p.v;p.x+=p.s;x.fillStyle=`hsl(${p.h},90%,60%)`;x.fillRect(p.x,p.y,p.r,p.r*1.6)});if(++n<320)requestAnimationFrame(f);else c.style.display='none'})()}
const SID='t'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),NO='⚠️ اضغطن زر واتساب أعلاه ثم «إرسال» لتصل النتيجة إلى المعلمة، أو «نسخ النتيجة» كاحتياط.';
const K='body_rescue_done_v1';
function save(){try{localStorage.setItem(K,JSON.stringify({team:G.team,mem:G.mem,score:G.score,st:G.st,el:G.el}))}catch(e){}}
function load(){try{if(location.hash=='#reset'){localStorage.removeItem(K);return null}const v=localStorage.getItem(K);return v?JSON.parse(v):null}catch(e){return null}}
async function chk(){}
async function board(){}
home();
</script>
